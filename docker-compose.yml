services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [agentnet, agentnet-isolated]

  dagster-webserver:
    build: ./orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      DAGSTER_HOME: /data/dagster
      AGENTBOX_HOST_REPO: ${AGENTBOX_HOST_REPO:-/home/vortex/GitHub/agentbox}
    volumes:
      - ./orchestrator:/opt/agentbox/orchestrator:ro
      - ./agents:/opt/agentbox/agents:ro
      - ./prompts:/opt/agentbox/prompts:ro
      - /data/dagster:/data/dagster
      - /data/workspaces:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DAGSTER_HOST_PORT:-3000}:3000"
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    networks: [agentnet]

  dagster-daemon:
    build: ./orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      DAGSTER_HOME: /data/dagster
      AGENTBOX_HOST_REPO: ${AGENTBOX_HOST_REPO:-/home/vortex/GitHub/agentbox}
    volumes:
      - ./orchestrator:/opt/agentbox/orchestrator:ro
      - ./agents:/opt/agentbox/agents:ro
      - ./prompts:/opt/agentbox/prompts:ro
      - /data/dagster:/data/dagster
      - /data/workspaces:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["dagster-daemon", "run"]
    networks: [agentnet]
  
  ui:
    build: ./ui
    restart: unless-stopped
    environment:
      DAGSTER_URL: http://dagster-webserver:3000
    volumes:
      - ./ui:/opt/agentbox/ui:ro
      - ./agents:/opt/agentbox/agents        # writable: the UI edits these
    ports:
      - "8080:8080"
    networks: [agentnet]

networks:
  agentnet:
    name: agentnet
  agentnet-isolated:
    name: agentnet-isolated
    internal: true
