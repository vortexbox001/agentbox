[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # Dagster 1.13.21's own Pipes machinery calls its preview API
    # PipesMessageReader.expected_writer_count internally (context.py:104). The warning
    # is framework-internal — not our code — and fires once per opened Pipes session, so
    # every make_run_op / build_asset test emits it. Silence just this one.
    ignore:Function .PipesMessageReader\.expected_writer_count. is currently in preview
