model_list:
  - model_name: cheap        # what agents ask for
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: smart        # a step up when a light agent needs it
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: opus         # top tier, for jobs where judgment matters more than cost
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  # Moonshot is OpenAI-compatible, so no special provider is needed. Aliases are mirrored in
  # images/agent-pi/entrypoint.sh (models.json) — keep the two lists in sync.
  # LiteLLM has no built-in pricing for these custom endpoints, so cost must be declared here or
  # runs report cost_usd=None (bug kimi-missing-litellm-pricing). Per-token = USD per 1M ÷ 1e6.
  # Rates from https://platform.kimi.ai/docs/pricing/chat#model-pricing (fetched 2026-09-12);
  # input_cost_per_token is the cache-miss rate, cache_read_input_token_cost the cache-hit rate.
  - model_name: kimi         # Kimi K2.7 Code, built for coding agents; 256k context
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/KIMI_API_KEY
      input_cost_per_token: 0.00000095          # $0.95 / 1M (cache miss)
      output_cost_per_token: 0.000004           # $4.00 / 1M
      cache_read_input_token_cost: 0.00000019   # $0.19 / 1M (cache hit)
  - model_name: kimi-k3      # Kimi K3 flagship; thinking-only, 1M context
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/KIMI_API_KEY
      input_cost_per_token: 0.000003            # $3.00 / 1M (cache miss)
      output_cost_per_token: 0.000015           # $15.00 / 1M
      cache_read_input_token_cost: 0.0000003    # $0.30 / 1M (cache hit)

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
