# agentbox-schema: 4
# Verification fixture (spec 007): a trivial, enabled api-harness job so SC-001's api leg
# (non-null cost_usd) and the US1 Independent Test can be run end-to-end — one agent per
# harness (T024, needed by quickstart Scenario 1). Copied from _template-api.yaml.

name: verify-api
enabled: true
harness: api

model: cheap
max_tokens: 256

prompt_file: verify-api.md
output_dir: /data/outputs/verify-api

job: true

network: agentnet-isolated
memory: 512m
cpus: 1.0
timeout_seconds: 300
