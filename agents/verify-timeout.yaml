# agentbox-schema: 4
# Verification fixture (spec 007): an agent with a deliberately short timeout_seconds so the
# run is killed mid-flight. Exercises the orchestrator's timeout fallback — the run records
# status: timeout with null numerics, and no agent-<name>-<runid> container survives (SC-004
# / quickstart Scenario 3, T025). Modelled as a claude-code asset so the timeout shows on a
# partition; any harness that runs longer than the timeout would do.

name: verify-timeout
enabled: true
harness: claude-code
model: sonnet

# far too short to finish any real work — the container is killed and the report authored
timeout_seconds: 5
max_turns: 50

produces:
  asset: verify/timeout
  partition: none

prompt_file: verify-timeout.md

workspace: /data/workspaces/verify-timeout
wipe_workspace: true
output_dir: /data/outputs/verify-timeout

permission_mode: default
allowed_tools:
  - Read
  - Write
  - Bash

network: bridge
memory: 1g
cpus: 1.5
