# agentbox-schema: 4
# Template: repo-librarian (claude-code harness)
# Clones a GitHub repo into a fresh workspace, reviews its documentation, and writes a report to /output.
# Copy this file, replace the <PLACEHOLDERS>, and set enabled: true.

name: repo-librarian            # unique kebab-case identifier; becomes Dagster job "agent_repo_librarian"
enabled: false                  # true | false — disabled agents are skipped at startup
harness: claude-code            # claude-code — runs Claude Code CLI via agentbox/agent-claude image

# --- Model ---
model: fable                    # Claude model alias (sonnet | opus | haiku | fable) or full model id (omit for CLI default)
effort: high                    # reasoning effort: low | medium | high | xhigh | max (omit for default)
fallback_model: "claude-opus-4-6[1m]"         # model to try if primary is overloaded (omit to disable)

# --- Prompt & output ---
prompt_file: repo-librarian.md        # file in prompts/ — read at launch and passed to `claude -p`
output_dir: /data/outputs/repo-librarian  # host path where agent output is written
append_system_prompt: ""        # extra text appended to the default system prompt (omit if unused)

# --- Workspace ---
workspace: /data/workspaces/repo-librarian  # host path mounted at /workspace in the container
                                      # default: /data/workspaces/<name>
wipe_workspace: false                 # true — empty the workspace before every run (default: false)

# --- Claude Code options ---
max_turns: 10                   # max agentic turns (default: 10)
permission_mode: default        # default | acceptEdits | auto | bypassPermissions | dontAsk | plan
allowed_tools:                  # tool allowlist — omit for no restriction
  - Read
  - Write
  - Bash
#disallowed_tools: []            # tool denylist — omit if unused
#mcp_config: ""                  # path to MCP server config JSON inside the container (omit if unused)

# --- Job ---
job: true                       # this agent has a launchable/schedulable job agent_<name>; declare an asset via produces below, or both. An agent must be an asset, a job, or both.

# --- Triggers (optional) ---
#triggers:                       # when this agent runs on its own (omit for manual/on-demand only)
#  job_schedule: "0 7 * * *"     # cron (5 fields, no @-macros) — launches the job on a schedule
#  asset_schedule: "0 7 * * *"   # cron — materializes the asset on a schedule (only when produces is set)

# --- Produces (optional) ---
#produces:                       # declare an output asset so this agent becomes a tracked Dagster asset (omit to stay a plain job)
#  asset: repo-review/agentbox   # asset key: kebab segments joined by / for grouping
#  partition: none               # none | daily — daily exposes a per-day partition (a tracking label only)
#  checks:                       # optional pass/fail asset checks on this asset (asset kind only)
#    - name: has-output          # required, kebab-case, unique; names the Dagster asset check
#      command: test -n "$(ls /output)"   # required; run as sh -c in a read-only container — exit 0 passes (last 4 KB of output attached)
#      blocking: true            # true gates downstream automation on failure (ERROR); false is advisory (WARN). Default true
#      timeout_seconds: 300      # killed and failed after this long (1..86400; default 300)
#    # image: agentbox/agent-python:latest   # optional; default is the agent's harness image
#    # network: agentnet         # optional; default is no network (agentnet-isolated | agentnet | bridge)

# --- Container resources ---
network: bridge                 # bridge — needs internet to reach Anthropic API (required)
                                # agentnet — if proxying through LiteLLM (not typical)
memory: 1g                      # container memory limit (default: 1g)
cpus: 1.5                       # CPU limit (default: 1.5)

# --- Execution ---
timeout_seconds: 1800           # kill container after this many seconds (default: 900)
                                # claude-code agents typically need longer than api agents

# --- Environment Variables ---
env:
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  GITHUB_USER: "<USERNAME>"      # e.g. "leeclemmer"
  GITHUB_REPONAME: "<REPONAME>"      # e.g. "agentbox"
