# Runs the Claude Code CLI in a container with a workspace and tool access.
# Generated by the agentbox UI — edits made here are replaced on the next save from the UI.
# agentbox-schema: 4

# --- Identity ---
name: verify-fail  # Unique kebab-case identifier. Becomes the Dagster job agent_<name> (hyphens become underscores).

# --- Enabled ---
enabled: true  # Whether Dagster registers this agent at all (as a job/asset). Disabled agents are skipped at load. This does NOT control scheduling — set when it runs in the Automation view. true or false; default true.

# --- Limits ---
timeout_seconds: 600  # The run is killed after this many seconds. 1 to 86400; default 900.
max_turns: 1  # Cap on agentic turns. 1 to 1000; default 10.

# --- Produces ---
produces:  # Declare an output asset so this agent is a tracked Dagster asset; leave commented to stay a plain job.
  asset: verify/fail  # Asset key this agent materializes, e.g. repo-review/agentbox. Kebab segments joined by / for grouping. Leave empty to stay a plain job.
  partition: daily  # Partition set for the asset: none (single) or daily. A tracking label only — it does not change the run or output. Default none.

# --- Triggers ---
#triggers:  # When this agent runs on its own. Optional per-kind cron(s); leave commented for manual/on-demand only.
#  asset_schedule:  # Cron that materializes the asset on a schedule (drives an on-cron auto-condition). Five fields, no @-macros. Applies only when the agent is an asset; blank = no schedule.

# --- Job ---
#job:  # Whether this agent has a Dagster job agent_<name> you can launch or schedule. true or false; default false. An agent must be an asset, a job, or both.

# --- Prompt ---
prompt_file: verify-fail.md  # File in prompts/ read at launch and given to the agent as its prompt.
#append_system_prompt:  # Extra text appended to the system prompt.

# --- Directories ---
workspace: /data/workspaces/verify-fail  # Host directory mounted at /workspace; scratch space for the run. Default /data/workspaces/<name>.
wipe_workspace: true  # Empty the workspace before every run so each run starts clean. true or false; default false.
output_dir: /data/outputs/verify-fail  # Host directory mounted at /output; every run writes its result files here.

# --- Tools & permissions ---
permission_mode: default  # Claude Code permission mode.
allowed_tools:  # Tool allowlist. claude-code: any tool names (e.g. Read, Write, Edit, Bash, Glob, Grep, WebFetch, WebSearch).
  - Read
  - Write
  - Bash
#disallowed_tools:  # Tool denylist (pi has no such flag).
#mcp_config:  # Path to an MCP server config JSON inside the container.

# --- Harness & model ---
harness: claude-code  # Which runtime runs this agent; determines the available fields and models. One of claude-code, pi, api, codex.
model: sonnet  # Model the harness talks to. claude-code: an alias (sonnet, opus, haiku, fable) or a full claude-... id; blank for the CLI default.
#effort:  # Reasoning/thinking effort level. claude-code: low, medium, high, xhigh, or max.
#fallback_model:  # Model to use if the primary is overloaded.

# --- Container ---
network: bridge  # Docker network: agentnet-isolated (LiteLLM only, no internet), agentnet (LiteLLM + internet), bridge (full internet — needed by claude-code and codex). Default depends on harness.
memory: 1g  # Container memory limit (e.g. 512m, 1g). Default 1g.
cpus: 1.5  # Container CPU limit (e.g. 1.5). 0.1 to 64; default 1.5.
