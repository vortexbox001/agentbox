name: hello-world
enabled: true
harness: api            # api | claude-code
model: cheap            # LiteLLM model_name (api harness only)
schedule: "0 7 * * *"   # cron, or "" for manual-only
prompt_file: hello-world.md
output_dir: /data/outputs/hello-world
max_tokens: 1024
timeout_seconds: 600
network: agentnet       # LiteLLM-only network; use "bridge" for internet
