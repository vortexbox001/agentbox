# Lightweight agent that sends a prompt to LiteLLM and writes the response.
# Generated by the agentbox UI — edits made here are replaced on the next save from the UI.
# agentbox-schema: 5

# --- Identity ---
name: verify-checks  # Unique kebab-case identifier. Becomes the Dagster job agent_<name> (hyphens become underscores).

# --- Enabled ---
enabled: true  # Whether Dagster registers this agent at all (as a job/asset). Disabled agents are skipped at load. This does NOT control scheduling — set when it runs in the Automation view. true or false; default true.

# --- Limits ---
timeout_seconds: 300  # The run is killed after this many seconds. 1 to 86400; default 900.

# --- Produces ---
produces:  # Declare an output asset so this agent is a tracked Dagster asset; leave commented to stay a plain job.
  asset: verify/checks  # Asset key this agent materializes, e.g. repo-review/agentbox. Kebab segments joined by / for grouping. Leave empty to stay a plain job.
  partition: none  # Partition set for the asset: none (single) or daily. A tracking label only — it does not change the run or output. Default none.
  checks:  # Optional pass/fail checks on the produced asset (needs an asset). Each runs after the producer in a fresh, read-only container and surfaces as a Dagster asset check — green on exit 0, red otherwise, with the last 4 KB of its output attached.
    - name: has-output
      command: test -n "$(ls /output)"
    - name: advisory-fail
      command: 'false'
      blocking: false
    - name: readonly-guard
      command: touch /output/x
    - name: slow
      command: sleep 60
      timeout_seconds: 2

# --- Triggers ---
#triggers:  # When this agent runs on its own. Optional per-kind cron(s); leave commented for manual/on-demand only.
#  asset_schedule:  # Cron that materializes the asset on a schedule (drives an on-cron auto-condition). Five fields, no @-macros. Applies only when the agent is an asset; blank = no schedule.

# --- Job ---
#job:  # Whether this agent has a Dagster job agent_<name> you can launch or schedule. true or false; default false. An agent must be an asset, a job, or both.

# --- Prompt ---
prompt_file: verify-api.md  # File in prompts/ read at launch and given to the agent as its prompt.

# --- Directories ---
output_dir: /data/outputs/verify-checks  # Host directory mounted at /output; every run writes its result files here.

# --- Harness & model ---
harness: api  # Which runtime runs this agent; determines the available fields and models. One of claude-code, pi, api, codex.
model: cheap  # Model the harness talks to. api: a LiteLLM alias from litellm/config.yaml.
max_tokens: 256  # Cap on response tokens. 1 to 200000; default 1024.

# --- Container ---
network: agentnet-isolated  # Docker network: agentnet-isolated (LiteLLM only, no internet), agentnet (LiteLLM + internet), bridge (full internet — needed by claude-code and codex). Default depends on harness.
memory: 512m  # Container memory limit (e.g. 512m, 1g). Default 1g.
cpus: 1.0  # Container CPU limit (e.g. 1.5). 0.1 to 64; default 1.5.
