# agentbox-schema: 8
# Template: codex harness
# Runs OpenAI's Codex CLI (`codex exec`) non-interactively in /workspace with its default tools.
# Authenticates with a ChatGPT login stored under /data/credentials/codex (see README "Codex
# credentials"); no LiteLLM. Same workspace/output conventions as the claude-code and pi harnesses.

name: my-codex-agent            # unique kebab-case identifier; becomes Dagster job "agent_my_codex_agent"
enabled: false                  # true | false — disabled agents are skipped at startup
harness: codex                  # codex — runs codex exec via agentbox/agent-codex image

# --- Model ---
model: ""                       # codex model id, e.g. gpt-5.3-codex-spark, gpt-5.6-sol (omit for codex's default)
effort: medium                  # reasoning effort: none | minimal | low | medium | high | xhigh (passed as model_reasoning_effort)

# --- Prompt & output ---
prompt_file: my-codex-agent.md  # file in prompts/ — read at launch and passed to `codex exec`
output_dir: /data/outputs/my-codex-agent  # host path mounted at /output
append_system_prompt: ""        # extra text appended to the prompt (codex has no system-prompt flag)

# --- Workspace ---
workspace: /data/workspaces/my-codex-agent  # host path mounted at /workspace (default: /data/workspaces/<name>)
wipe_workspace: false           # true — empty the workspace before every run (default: false)

# --- Environment ---
env:
  # GITHUB_TOKEN: ${GITHUB_TOKEN}   # passthrough from Dagster's environment

# --- Job ---
job: true                       # this agent has a launchable/schedulable job agent_<name>; declare an asset via produces below, or both. An agent must be an asset, a job, or both.

# --- Triggers (optional) ---
#triggers:                       # when this agent runs on its own (omit for manual/on-demand only)
#  job_schedule: "0 7 * * *"     # cron (5 fields, no @-macros) — launches the job on a schedule
#  asset_schedule: "0 7 * * *"   # cron — materializes the asset on a schedule (only when produces is set)
#  on_upstream: true             # materialize when any declared upstream materializes and passes its blocking checks (asset only; spec 013)
#  on_missing: true              # materialize the current/latest partition when it has never been produced — no history backfill (asset only; spec 013)
#  on_project_status:            # launch this agent when an issue enters a GitHub Projects board status (spec 016)
#    owner: vortexbox001         # GitHub org (or user) that owns the Projects board (required)
#    project: 1                  # the Projects board number, a positive integer (required)
#    status: In progress         # the Status option name; entering it launches this agent, matched case-insensitively (required)
#    label: brief                # optional — only issues carrying this label launch
#    repo: vortexbox001/agentbox # optional — only issues from this owner/repo launch (case-insensitive)
#    interval_seconds: 60        # optional — poll cadence in seconds (default 60, minimum 30)
#                                # read by the paused project_status_<name> sensor via GITHUB_PROJECT_TOKEN (board-read scope, sensor-only, no GITHUB_TOKEN fallback)

# --- Produces (optional) ---
#produces:                       # declare an output asset so this agent becomes a tracked Dagster asset (omit to stay a plain job)
#  asset: repo-review/agentbox   # asset key: kebab segments joined by / for grouping
#  partition: none               # none | daily — daily exposes a per-day partition (a tracking label only)
#  depends_on:                    # upstream asset keys this asset depends on; each is handed to the container as AGENTBOX_UPSTREAM_<KEY> (spec 013)
#    - notes/daily
#  checks:                       # optional pass/fail asset checks on this asset (asset kind only)
#    - name: has-output          # required, kebab-case, unique; names the Dagster asset check
#      command: test -n "$(ls /output)"   # required; run as sh -c in a read-only container — exit 0 passes (last 4 KB of output attached)
#      blocking: true            # true gates downstream automation on failure (ERROR); false is advisory (WARN). Default true
#      timeout_seconds: 300      # killed and failed after this long (1..86400; default 300)
#    # image: agentbox/agent-python:latest   # optional; default is the agent's harness image
#    # network: agentnet         # optional; default is no network (agentnet-isolated | agentnet | bridge)

# --- Container resources ---
network: bridge                 # needs internet to reach OpenAI directly
memory: 1g
cpus: 1.5

# --- Execution ---
timeout_seconds: 1800           # the only cap on a runaway run; codex exec has no max-turns flag
