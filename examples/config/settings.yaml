# Instance settings (config/settings.yaml).
#
# Seeded into a fresh box; the UI's Settings page reads and writes it (spec 012). Unknown
# keys are preserved on write, so future settings sections extend this same file. The
# fresh-install copies this to config/settings.yaml.

# schema_version: 1   # reserved — settings schema is defined by a future brief

# Run retention (spec 012, FR-025..029). Governs the nightly prune job (sched_prune_runs).
#   mode: keep_forever  — nothing is ever pruned (the default; prune job is a no-op).
#   mode: prune_after_days — remove events.jsonl + transcript.jsonl from run directories
#                            older than `days`; report.json, context.json, and /output
#                            artifacts are ALWAYS kept, so pruned runs still open.
retention:
  mode: keep_forever
  # days: 30   # required (int >= 1) when mode is prune_after_days

# Run governors (spec 013, FR-014..018). Bound automated trigger chains; the orchestrator reads
# this block at op time and the Settings page edits it. Manual runs bypass both limits.
#   max_runs_per_hour — cap on automated runs in a rolling 60-minute window; a run that would
#                       exceed it is refused, logged, and skipped without consuming a slot.
#   max_chain_depth   — cap on how deep an automated chain of triggers may go (root run = 1).
# Absent block/keys fall back to the defaults shown below.
governors:
  max_runs_per_hour: 12
  max_chain_depth: 5
