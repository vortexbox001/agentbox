<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 22 84 76" fill="none">
  <!-- agentbox mark: a container holding a grid of agents in different states.
       Transparent ground, cropped tight so the mark fills the browser-tab icon. -->
  <rect x="26" y="30" width="68" height="60" rx="8" stroke="#00e5ff" stroke-width="6"/>
  <g stroke="none">
    <rect x="35" y="39" width="15" height="15" rx="3" fill="#00e5ff"/>
    <rect x="53" y="39" width="15" height="15" rx="3" fill="#ffffff" fill-opacity=".2"/>
    <rect x="71" y="39" width="15" height="15" rx="3" fill="#e040fb"/>
    <rect x="35" y="57" width="15" height="15" rx="3" fill="#ffffff" fill-opacity=".2"/>
    <rect x="53" y="57" width="15" height="15" rx="3" fill="#69f0ae"/>
    <rect x="71" y="57" width="15" height="15" rx="3" fill="#ffffff" fill-opacity=".2"/>
    <rect x="35" y="75" width="15" height="9" rx="3" fill="#ffd740"/>
    <rect x="53" y="75" width="15" height="9" rx="3" fill="#ffffff" fill-opacity=".2"/>
    <rect x="71" y="75" width="15" height="9" rx="3" fill="#00e5ff" fill-opacity=".6"/>
  </g>
</svg>
