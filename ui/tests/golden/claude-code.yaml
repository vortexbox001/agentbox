# Runs the Claude Code CLI in a container with a workspace and tool access.
# Generated by the agentbox UI — edits made here are replaced on the next save from the UI.
# agentbox-schema: 8

# --- Identity ---
name: sample-claude-code  # Unique kebab-case identifier. Becomes the Dagster job agent_<name> (hyphens become underscores).

# --- Enabled ---
enabled: true  # Whether Dagster registers this agent at all (as a job/asset). Disabled agents are skipped at load. This does NOT control scheduling — set when it runs in the Automation view. true or false; default true.

# --- Limits ---
timeout_seconds: 1800  # The run is killed after this many seconds. 1 to 86400; default 900.
max_turns: 50  # Cap on agentic turns. 1 to 1000; default 10.

# --- Produces ---
#produces:  # Declare an output asset so this agent is a tracked Dagster asset; leave commented to stay a plain job.
#  asset:  # Asset key this agent materializes, e.g. repo-review/agentbox. Kebab segments joined by / for grouping. Leave empty to stay a plain job.
#  partition: none  # Partition set for the asset: none (single) or daily. A tracking label only — it does not change the run or output. Default none.

# --- Triggers ---
#triggers:  # When this agent runs on its own. Optional per-kind cron(s); leave commented for manual/on-demand only.
#  job_schedule:  # Cron that launches the agent's job on a schedule. Five fields, no @-macros. Applies only when the agent has a job; blank = manual/launchable only.
#  on_project_status:  # Launch this agent when an issue enters a GitHub Projects board status. owner/project/status are required; label/repo/interval_seconds are optional. Read by the paused project_status_<name> sensor using GITHUB_PROJECT_TOKEN.
#    owner:  # GitHub org (or user) that owns the Projects board.
#    project:  # The Projects board number (positive integer).
#    status:  # The Status column option name; an issue entering it launches this agent (matched case-insensitively).
#    label:  # Optional — only issues carrying this label launch.
#    repo:  # Optional — only issues from this owner/repo launch (matched case-insensitively).
#    interval_seconds:  # Poll cadence in seconds (default 60, minimum 30).

# --- Job ---
job: true  # Whether this agent has a Dagster job agent_<name> you can launch or schedule. true or false; default false. An agent must be an asset, a job, or both.

# --- Prompt ---
prompt_file: hello-example.md  # File in prompts/ read at launch and given to the agent as its prompt.
#append_system_prompt:  # Extra text appended to the system prompt.

# --- Directories ---
workspace: /data/workspaces/sample-claude-code  # Host directory mounted at /workspace; scratch space for the run. Default $AGENTBOX_DATA/workspaces/<name>.
wipe_workspace: true  # Empty the workspace before every run so each run starts clean. true or false; default false.
output_dir: /data/outputs/sample-claude-code  # Host directory mounted at /output; every run writes its result files here. Must fall under the data root ($AGENTBOX_DATA). Default $AGENTBOX_DATA/outputs/<name>.

# --- Environment ---
#env_file:  # Host path to an env file passed to the container (keeps secrets off the command line). Applies to every harness.
env:  # Environment variables for the container. ${NAME} forwards the host variable by name without exposing its value.
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  GITHUB_USER: example-user
  GITHUB_REPONAME: example-repo

# --- Tools & permissions ---
permission_mode: default  # Claude Code permission mode.
allowed_tools:  # Tool allowlist. claude-code: any tool names (e.g. Read, Write, Edit, Bash, Glob, Grep, WebFetch, WebSearch).
  - Read
  - Write
  - Bash
#disallowed_tools:  # Tool denylist (pi has no such flag).
#mcp_config:  # Path to an MCP server config JSON inside the container.

# --- Harness & model ---
harness: claude-code  # Which runtime runs this agent; determines the available fields and models. One of claude-code, pi, api, codex.
model: claude-opus-4-8[1m]  # Model the harness talks to. claude-code: an alias (sonnet, opus, haiku, fable) or a full claude-... id; blank for the CLI default.
effort: high  # Reasoning/thinking effort level. claude-code: low, medium, high, xhigh, or max.
fallback_model: claude-opus-4-8[1m]  # Model to use if the primary is overloaded.

# --- Container ---
network: bridge  # Docker network: agentnet-isolated (LiteLLM only, no internet), agentnet (LiteLLM + internet), bridge (full internet — needed by claude-code and codex). Default depends on harness.
memory: 1g  # Container memory limit (e.g. 512m, 1g). Default 1g.
cpus: 1.5  # Container CPU limit (e.g. 1.5). 0.1 to 64; default 1.5.
