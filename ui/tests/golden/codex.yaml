# Runs OpenAI's Codex CLI (codex exec) non-interactively in /workspace with its default tools.
# Generated by the agentbox UI — edits made here are replaced on the next save from the UI.
# agentbox-schema: 1

# --- Identity ---
name: repo-librarian-codex  # Unique kebab-case identifier. Becomes the Dagster job agent_<name> (hyphens become underscores).
enabled: true  # Disabled agents are skipped when Dagster loads the workspace. true or false; default true.
harness: codex  # Which runtime runs this agent; determines the available fields and models. One of claude-code, pi, api, codex.

# --- Model ---
model: gpt-6-astra  # Model the harness talks to. codex: any codex model id; blank for codex's default.
effort: high  # Reasoning/thinking effort level. codex: none, minimal, low, medium, high, or xhigh.

# --- Prompt & output ---
prompt_file: repo-librarian2.md  # File in prompts/ read at launch and given to the agent as its prompt.
output_dir: /data/outputs/repo-librarian-codex  # Host directory mounted at /output; every run writes its result files here.
#append_system_prompt:  # Extra text appended to the system prompt.

# --- Workspace ---
workspace: /data/workspaces/repo-librarian-codex  # Host directory mounted at /workspace; scratch space for the run. Default /data/workspaces/<name>.
wipe_workspace: true  # Empty the workspace before every run so each run starts clean. true or false; default false.

# --- Execution ---
timeout_seconds: 1800  # The run is killed after this many seconds. 1 to 86400; default 900.

# --- Scheduling ---
schedule: ''  # Cron expression for automatic runs; leave empty for manual-only. Five fields, e.g. 0 7 * * *.

# --- Container resources ---
network: bridge  # Docker network: agentnet-isolated (LiteLLM only, no internet), agentnet (LiteLLM + internet), bridge (full internet — needed by claude-code and codex). Default depends on harness.
memory: 1g  # Container memory limit (e.g. 512m, 1g). Default 1g.
cpus: 1.5  # Container CPU limit (e.g. 1.5). 0.1 to 64; default 1.5.

# --- Environment ---
#env_file:  # Host path to an env file passed to the container (keeps secrets off the command line). Applies to every harness.
env:  # Environment variables for the container. ${NAME} forwards the host variable by name without exposing its value.
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  GITHUB_USER: leeclemmer
  GITHUB_REPONAME: agentbox
