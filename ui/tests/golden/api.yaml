# Lightweight agent that sends a prompt to LiteLLM and writes the response.
# Generated by the agentbox UI — edits made here are replaced on the next save from the UI.
# agentbox-schema: 1

# --- Identity ---
name: nightly-digest  # Unique kebab-case identifier. Becomes the Dagster job agent_<name> (hyphens become underscores).
enabled: true  # Disabled agents are skipped when Dagster loads the workspace. true or false; default true.
harness: api  # Which runtime runs this agent; determines the available fields and models. One of claude-code, pi, api, codex.

# --- Model ---
model: cheap  # Model the harness talks to. api: a LiteLLM alias from litellm/config.yaml.
max_tokens: 1024  # Cap on response tokens. 1 to 200000; default 1024.

# --- Prompt & output ---
prompt_file: repo-librarian.md  # File in prompts/ read at launch and given to the agent as its prompt.
output_dir: /data/outputs/nightly-digest  # Host directory mounted at /output; every run writes its result files here.

# --- Execution ---
timeout_seconds: 600  # The run is killed after this many seconds. 1 to 86400; default 900.

# --- Scheduling ---
schedule: 0 7 * * *  # Cron expression for automatic runs; leave empty for manual-only. Five fields, e.g. 0 7 * * *.

# --- Container resources ---
network: agentnet-isolated  # Docker network: agentnet-isolated (LiteLLM only, no internet), agentnet (LiteLLM + internet), bridge (full internet — needed by claude-code and codex). Default depends on harness.
memory: 1g  # Container memory limit (e.g. 512m, 1g). Default 1g.
cpus: 1.5  # Container CPU limit (e.g. 1.5). 0.1 to 64; default 1.5.

# --- Environment ---
env_file: /data/credentials/agent-secrets.env  # Host path to an env file passed to the container (keeps secrets off the command line). Applies to every harness.
env:  # Environment variables for the container. ${NAME} forwards the host variable by name without exposing its value.
  GITHUB_USER: leeclemmer
