[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # starlette 0.41.3's TestClient references anyio.abc.BlockingPortal, an alias
    # anyio 4.15 deprecated. It's dependency-internal (pinned via fastapi==0.115.6,
    # fixed only in starlette >=0.46 / a fastapi major bump), so silence just this one.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
