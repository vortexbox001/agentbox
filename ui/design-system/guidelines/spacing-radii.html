<!-- @dsCard group="Spacing" viewport="700x100" name="Border Radii" subtitle="4px → 6px → 8px → 10px → 12px → pill" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-background-default);font-family:var(--font-default);display:flex;align-items:center;gap:12px;height:100px}.box{width:56px;height:56px;border:2px solid var(--color-core-teal500);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:var(--color-text-light)}</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">4px</div>
<div class="box" style="border-radius:var(--radius-md)">6px</div>
<div class="box" style="border-radius:var(--radius-lg)">8px</div>
<div class="box" style="border-radius:var(--radius-xl)">10px</div>
<div class="box" style="border-radius:var(--radius-2xl)">12px</div>
<div class="box" style="border-radius:var(--radius-pill);width:80px">pill</div>
<div class="box" style="border-radius:var(--radius-round)">50%</div>
</body></html>
