<!-- @dsCard group="Colors" viewport="700x140" name="Semantic Surfaces" subtitle="Background levels for light theme" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:12px;display:flex;gap:8px;height:140px;background:var(--color-background-default);font-family:var(--font-default)}.box{flex:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--color-text-light);gap:4px;border:1px solid var(--color-border-default)}.lbl{font-weight:600;color:var(--color-text-default);font-size:11px}</style></head><body>
<div class="box" style="background:var(--color-background-default)"><span class="lbl">Default</span>white</div>
<div class="box" style="background:var(--color-background-light)"><span class="lbl">Light</span>gray-10</div>
<div class="box" style="background:var(--color-background-lighter)"><span class="lbl">Lighter</span>gray-50</div>
<div class="box" style="background:var(--color-background-blue)"><span class="lbl">Active</span>teal-12%</div>
<div class="box" style="background:var(--color-background-gray)"><span class="lbl">Muted</span>gray-12%</div>
</body></html>
