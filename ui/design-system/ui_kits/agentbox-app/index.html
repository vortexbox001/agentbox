<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
html, body, #root { margin: 0; padding: 0; height: 100%; overflow: hidden; }
.ax-lockup-dark { display: none; }
[data-theme="dark"] .ax-lockup-light { display: none; }
[data-theme="dark"] .ax-lockup-dark { display: block; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Sidebar.jsx"></script>
<script type="text/babel" src="./AgentsPage.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState('agents');
  const [collapsed, setCollapsed] = React.useState(false);

  const containerS = {
    height: '100%', display: 'flex', flexDirection: 'row',
    fontFamily: 'var(--font-default)',
    backgroundColor: 'var(--color-background-default)',
    color: 'var(--color-text-default)',
  };
  const mainS = {
    flex: 1, height: '100%', display: 'flex', flexDirection: 'column',
    overflow: 'hidden',
    width: collapsed ? 'calc(100% - 68px)' : 'calc(100% - 240px)',
  };

  return (
    <div style={containerS}>
      <Sidebar
        activeKey={page}
        onNav={setPage}
        collapsed={collapsed}
        onToggleCollapse={() => setCollapsed(!collapsed)}
      />
      <div style={mainS}>
        {page === 'agents' || page === 'overview' ? <AgentsPage /> : (
          <div style={{padding: '24px'}}>
            <div style={{font: 'var(--type-display-lg)', color: 'var(--color-text-default)', marginBottom: '8px'}}>
              {page.charAt(0).toUpperCase() + page.slice(1)}
            </div>
            <div style={{font: 'var(--type-body-md)', color: 'var(--color-text-light)'}}>
              This page is a placeholder for the {page} view.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
