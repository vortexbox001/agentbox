<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="styles.css">
<style>
html, body { margin: 0; padding: 0; width: 1280px; height: 854px; overflow: hidden; }
body { display: flex; }
.main { flex: 1; background: var(--color-core-navy800); display: flex; align-items: center; justify-content: center; }
.brand { font-family: var(--font-default); font-size: 88px; font-weight: 700; color: var(--color-core-white); letter-spacing: -0.02em; }
.strip { width: 25%; display: flex; flex-direction: column; }
.strip > div { flex: 1; }
</style>
</head><body>
<div class="main" style="gap:40px"><img src="assets/logo.svg" alt="AgentBox" style="height:300px"><img src="assets/wordmark.svg" alt="agentbox" style="height:120px"></div>
<div class="strip">
<div style="background: var(--color-core-lime400)"></div>
<div style="background: var(--color-core-teal400)"></div>
<div style="background: var(--color-core-teal700)"></div>
<div style="background: var(--color-core-navy900)"></div>
</div>
</body></html>
