<!-- @dsCard group="Components" viewport="820x480" name="Dropdown" subtitle="Custom select — optional per-option icons, or a filterable list with trailing values" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../static/app.css">
</head><body style="margin:0;padding:var(--space-9);background:var(--color-background-default);font-family:var(--font-default)">
<!-- Icon sprite inlined so <use href="#id"> resolves in this document (external
     sprite refs are blocked under signed-URL previews). -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"></circle><line x1="10.5" y1="10.5" x2="14" y2="14"></line></symbol>
  <symbol id="theme-light" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"></circle><line x1="8" y1="1.5" x2="8" y2="3"></line><line x1="8" y1="13" x2="8" y2="14.5"></line><line x1="1.5" y1="8" x2="3" y2="8"></line><line x1="13" y1="8" x2="14.5" y2="8"></line><line x1="3.4" y1="3.4" x2="4.5" y2="4.5"></line><line x1="11.5" y1="11.5" x2="12.6" y2="12.6"></line><line x1="12.6" y1="3.4" x2="11.5" y2="4.5"></line><line x1="4.5" y1="11.5" x2="3.4" y2="12.6"></line></symbol>
  <symbol id="theme-dark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.4A5.5 5.5 0 0 1 6.6 2.5 5.5 5.5 0 1 0 13.5 9.4Z"></path></symbol>
  <symbol id="theme-system" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="8" rx="1"></rect><line x1="6" y1="13.5" x2="10" y2="13.5"></line><line x1="8" y1="11" x2="8" y2="13.5"></line></symbol>
</svg>
<div style="display:flex;gap:var(--space-12);align-items:flex-start;flex-wrap:wrap">
  <div style="display:flex;flex-direction:column;gap:var(--space-4)">
    <label class="ax-field-label" for="d-theme">Theme — options with icons</label>
    <select class="ax-select" id="d-theme">
      <option value="light" data-icon="theme-light">Light</option>
      <option value="dark" data-icon="theme-dark">Dark</option>
      <option value="system" data-icon="theme-system" selected>Use system setting</option>
    </select>
  </div>
  <div style="display:flex;flex-direction:column;gap:var(--space-4)">
    <label class="ax-field-label" for="d-tz">Timezone — filterable, trailing values</label>
    <select class="ax-select" id="d-tz" data-filter="Filter…">
      <option value="local" data-note="EDT -4:00" selected>Local timezone</option>
      <option value="utc" data-note="0:00">UTC</option>
      <option value="la" data-note="-7:00">America/Los_Angeles</option>
      <option value="denver" data-note="-6:00">America/Denver</option>
      <option value="chicago" data-note="-5:00">America/Chicago</option>
      <option value="ny" data-note="-4:00">America/New_York</option>
      <option value="midway" data-note="-11:00">Pacific/Midway</option>
      <option value="niue" data-note="-11:00">Pacific/Niue</option>
      <option value="london" data-note="+1:00">Europe/London</option>
      <option value="berlin" data-note="+2:00">Europe/Berlin</option>
      <option value="tokyo" data-note="+9:00">Asia/Tokyo</option>
    </select>
  </div>
</div>
<script type="module">
  import { enhanceSelects } from '../../static/dropdown.js';
  enhanceSelects(document);
  // Open the filter variant so the card shows the panel + trailing values.
  requestAnimationFrame(() => document.getElementById('d-tz').axDropdown.open());
</script>
</body></html>
