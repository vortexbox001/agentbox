<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../static/app.css">
</head><body style="margin:0;padding:var(--space-6);background:var(--color-background-default);font-family:var(--font-default)">
<!-- Production markup: the `disclosure` macro → `ax-section`, styled by /static/app.css. -->
<section class="ax-section" data-section data-section-id="summary">

  </div>
</section>
