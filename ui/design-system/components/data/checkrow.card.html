<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="../../static/app.css">
</head><body style="margin:0;padding:var(--space-6);background:var(--color-background-default);font-family:var(--font-default)">
<!-- Production markup: the `check_row` macro → `ax-checkrow`, reusing the ax-result mark. -->
<div class="ax-checkrow">
  <span class="ax-checkrow-mark"><span class="ax-result ax-result--pass" role="img" aria-label="Passed"><svg class="ax-icon" width="16" height="16" aria-hidden="true"><use href="#check-circle"></use></svg></span></span>
  <span class="ax-checkrow-name">freshness</span>
  <span class="ax-checkrow-detail">materialized within 24h</span>
  <span class="ax-checkrow-time">Sep 18, 1:15 PM</span>
</div>
</body></html>
