<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>AgentBox Design System</title>
  <script>
    // Pre-paint theme so the page opens in the reader's chosen theme with no flash.
    (function () {
      try {
        var pref = localStorage.getItem("agentbox.theme") || "system";
        var dark = pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="_ds_bundle.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>

  <style>
    body { margin: 0; background: var(--color-background-light); color: var(--color-text-default); font-family: var(--font-default); font: var(--type-body-md); }
    header.top {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: var(--space-8); flex-wrap: wrap;
      padding: var(--space-7) var(--space-10);
      background: var(--color-background-default);
      border-bottom: thin solid var(--color-border-default);
    }
    header.top img { height: 26px; width: auto; }
    header.top .lockup-dark { display: none; }
    [data-theme="dark"] header.top .lockup-light { display: none; }
    [data-theme="dark"] header.top .lockup-dark { display: inline; }
    header.top nav { display: flex; gap: var(--space-8); margin-left: auto; align-items: center; }
    a { color: var(--color-link-default); text-decoration: none; }
    a:hover { color: var(--color-link-hover); text-decoration: underline; }
    .theme-toggle {
      font: var(--type-body-sm); font-family: var(--font-default);
      color: var(--color-text-light); background: var(--color-background-light);
      border: thin solid var(--color-border-default); border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-6); cursor: pointer;
    }
    .theme-toggle:hover { background: var(--color-background-lighter); color: var(--color-text-default); }
    main { padding: var(--space-10); max-width: 64rem; margin: 0 auto; }
    .lede { color: var(--color-text-light); max-width: 44rem; margin: 0 0 var(--space-12); font: var(--type-body-lg); }
    section.group { margin-bottom: var(--space-14); }
    section.group > h2 {
      font: var(--type-display-md); margin: 0 0 var(--space-8);
      padding-bottom: var(--space-4); border-bottom: thin solid var(--color-keyline-default);
    }
    figure.specimen { margin: 0 0 var(--space-9); }
    figure.specimen figcaption { display: flex; align-items: baseline; gap: var(--space-6); margin-bottom: var(--space-4); flex-wrap: wrap; }
    figcaption .name { font: var(--type-display-sm); color: var(--color-text-default); }
    figcaption .sub { font: var(--type-body-sm); color: var(--color-text-light); }
    .frame {
      background: var(--color-background-default);
      border: thin solid var(--color-border-default);
      border-radius: var(--radius-lg);
      padding: 16px 20px; overflow: hidden;
    }
    .frame--flush { padding: 0; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr)); gap: var(--space-7); }
    .strip { display: flex; height: 76px; }
    .strip .s { flex: 1; display: flex; align-items: flex-end; padding: 8px; font-size: 9px; font-weight: 500; }
    .col-row { display: flex; flex-direction: column; gap: 8px; }
    .col-row .stack { display: flex; }
    .col-row .stack .s { flex: 1; display: flex; align-items: center; justify-content: center; height: 34px; font-size: 9px; font-weight: 500; }
  </style>
</head>

  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.getAttribute("data-theme") === "dark";
      if (dark) { root.removeAttribute("data-theme"); try { localStorage.setItem("agentbox.theme", "light"); } catch (e) {} }
      else { root.setAttribute("data-theme", "dark"); try { localStorage.setItem("agentbox.theme", "dark"); } catch (e) {} }
    });
  </script>

  <script type="text/babel">
    const NS = window.AgentBoxDesignSystem_463fbd || {};
    const { Button, Table, Badge, StatusDot, Spinner, Alert, RunStatusTag, SchedulePill, TextInput, Select, Checkbox, Toggle, Card, Tabs, Tab } = NS;

    function Frame({ name, sub, children, flush, style }) {
      return (
        <figure className="specimen">
          <figcaption><span className="name">{name}</span>{sub && <span className="sub">{sub}</span>}</figcaption>
          <div className={"frame" + (flush ? " frame--flush" : "")} style={style}>{children}</div>
        </figure>
      );
    }
    function FormsDemo() {
      const [c, setC] = React.useState(true);
      const [t, setT] = React.useState(true);
      return (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
          <TextInput label="Agent Name" placeholder="e.g. summarizer-v2" />
          <Select label="Model" options={["gpt-4o", "gpt-4o-mini", "claude-3.5-sonnet"]} />
          <Checkbox label="Enable auto-retry" checked={c} onChange={setC} />
          <Toggle label="Active" checked={t} onChange={setT} />
        </div>
      );
    }
    function TabsDemo() {
      const [tab, setTab] = React.useState("runs");
      return (
        <Tabs selectedId={tab} onChange={setTab}>
          <Tab id="runs" count={24}>Runs</Tab>
          <Tab id="config">Configuration</Tab>
          <Tab id="logs">Logs</Tab>
          <Tab id="history" disabled>History</Tab>
        </Tabs>
      );
    }
    const cols = [
      { key: "name", label: "Agent", width: "2fr" },
      { key: "status", label: "Status", width: "1fr", render: r => <Badge label={r.status} intent={r.status} /> },
      { key: "runs", label: "Runs", width: "80px" },
      { key: "last", label: "Last Run", width: "1fr" },
    ];
    const rows = [
      { name: "summarizer-v2", status: "running", runs: "124", last: "2m ago" },
      { name: "code-reviewer", status: "success", runs: "89", last: "1h ago" },
      { name: "data-cleaner", status: "error", runs: "45", last: "3h ago" },
    ];
    function Components() {
      return (
        <React.Fragment>
          <Frame name="Button" sub="Primary, outlined, danger, success, default, disabled">
            <div style={{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}>
              <Button intent="primary">Primary</Button>
              <Button outlined>Outlined</Button>
              <Button intent="danger" outlined>Danger</Button>
              <Button intent="success">Success</Button>
              <Button>Default</Button>
              <Button disabled>Disabled</Button>
            </div>
          </Frame>
          <Frame name="Badge, StatusDot, Spinner, RunStatusTag, SchedulePill, Alert" sub="Status feedback">
            <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
              <div style={{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}>
                <Badge label="running" intent="running" /><Badge label="success" intent="success" /><Badge label="error" intent="error" /><Badge label="warning" intent="warning" /><Badge label="queued" intent="queued" /><Badge label="scheduled" intent="scheduled" />
              </div>
              <div style={{ display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" }}>
                <StatusDot status="running" /><span style={{ fontSize: "12px", color: "var(--color-text-light)" }}>Running</span>
                <StatusDot status="success" /><span style={{ fontSize: "12px", color: "var(--color-text-light)" }}>Success</span>
                <StatusDot status="error" /><span style={{ fontSize: "12px", color: "var(--color-text-light)" }}>Error</span>
                <StatusDot status="idle" /><span style={{ fontSize: "12px", color: "var(--color-text-light)" }}>Idle</span>
                <Spinner size={16} />
              </div>
              <div style={{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}>
                <RunStatusTag status="success" label="2 hours ago" /><RunStatusTag status="started" label="running now" /><RunStatusTag status="failure" label="5 days ago" />
              </div>
              <div style={{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap" }}>
                <SchedulePill type="schedule" label="Every day at 7:00 AM" on={true} onToggle={() => {}} /><SchedulePill type="sensor" label="Every Monday at 6:00 AM" on={false} onToggle={() => {}} />
              </div>
              <Alert intent="info" title="Agent deployed">summarizer-v2 is now running on schedule.</Alert>
            </div>
          </Frame>
          <Frame name="TextInput, Select, Checkbox, Toggle" sub="Form controls"><FormsDemo /></Frame>
          <Frame name="Tabs, Tab" sub="Bottom-border indicator with count badges"><TabsDemo /></Frame>
          <Frame name="Card" sub="Static and interactive content cards">
            <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>
              <Card style={{ flex: "1 1 240px" }}>
                <div style={{ font: "var(--type-display-sm)", color: "var(--color-text-default)", marginBottom: "8px" }}>Agent Summary</div>
                <div style={{ font: "var(--type-body-sm)", color: "var(--color-text-light)" }}>3 runs today · 2 success · 1 error</div>
              </Card>
              <Card interactive style={{ flex: "1 1 240px", borderColor: "var(--color-core-teal500)" }}>
                <div style={{ font: "var(--type-display-sm)", color: "var(--color-text-default)", marginBottom: "8px" }}>Quick Actions</div>
                <div style={{ font: "var(--type-body-sm)", color: "var(--color-text-light)" }}>Click to trigger a manual run</div>
              </Card>
            </div>
          </Frame>
          <Frame name="Table — detail" sub="Inset from edges (single-object pages)">
            <Table columns={cols} rows={rows} />
          </Frame>
          <Frame name="Table — full bleed" sub="Rules edge to edge (object-overview lists)" flush>
            <Table columns={cols} rows={rows} fullBleed />
          </Frame>
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById("components-root")).render(<Components />);
  </script>
</body>
</html>
